name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
    coverage:
        name: "Coverage"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0.8.1
              with:
                  environments: coverage

            - name: "Check code coverage"
              env:
                  MOSEKLM_LICENSE_FILE: ${{ secrets.MSK_LICENSE }}
              run: |
                  pixi run -e coverage coverage

            - name: "Coveralls"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  pixi exec coveralls --service=github --rcfile=pyproject.toml

    lint:
        name: "Code style"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0.8.1
              with:
                  environments: lint

            - name: "Check code style"
              run: |
                  pixi run -e lint lint

    test:
        name: "Test ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest]

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Set up pixi"
              uses: prefix-dev/setup-pixi@v0.8.1

            - name: "Run unit tests"
              run: |
                  pixi run test

    ci_success:
        name: "CI success"
        runs-on: ubuntu-latest
        needs: [coverage, lint, test]
        steps:
            - run: echo "CI workflow completed successfully"
