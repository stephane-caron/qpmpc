[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "qpmpc"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
maintainers = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
dynamic = ['version', 'description']
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "qpsolvers >=1.8.0",
]
keywords = ["model", "predictive", "control", "linear", "time-varying"]

[project.optional-dependencies]
extras = [
    "loop-rate-limiters",
]

[project.urls]
Homepage = "https://github.com/stephane-caron/qpmpc"
Documentation = "https://scaron.info/doc/qpmpc/"
Source = "https://github.com/stephane-caron/qpmpc"
Tracker = "https://github.com/stephane-caron/qpmpc/issues"
Changelog = "https://github.com/stephane-caron/qpmpc/blob/main/CHANGELOG.md"

[tool.flit.module]
name = "qpmpc"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pydocstyle
    "D"
]
ignore = [
    "D401",  # good for methods but not for class docstrings
    "D405",  # British-style section names are also "proper"!
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true

[tool.pylint.'messages control']
# C0103: Argument name doesn't conform to snake_case naming style (qpsolvers
#        uses uppercase for matrices)
# E1130: bad operand type for unary - (false positives fixed in newer versions
#        of pylint, see https://github.com/PyCQA/pylint/issues/2436)
disable = ["C0103", "E1130", "import-error"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
qpmpc = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10"
qpsolvers = ">=3.4.0"

[tool.pixi.feature.test.dependencies]
matplotlib = ">=3.7.0"
proxsuite = ">=0.6.1"

[tool.pixi.feature.test.tasks]
test = "python -m unittest discover"

[tool.pixi.feature.coverage.dependencies]
coverage = ">=5.5"
matplotlib = ">=3.7.0"
proxsuite = ">=0.6.1"
qpsolvers = ">=3.4.0"

[tool.pixi.feature.coverage.tasks]
coverage-erase = "coverage erase"
coverage-run = { cmd = "coverage run -m unittest discover", depends-on = ["coverage-erase"] }
coverage = { cmd = "coverage report --include=\"qpmpc/*\"", depends-on = ["coverage-run"] }

[tool.pixi.feature.lint.dependencies]
matplotlib = ">=3.7.0"
mypy = ">=0.812"
proxsuite = ">=0.6.1"
pylint = ">=2.8.2"
qpsolvers = ">=3.4.0"
ruff = ">=0.2.2"

[tool.pixi.feature.lint.tasks]
lint-mypy = "mypy qpmpc"
lint-pylint = "pylint qpmpc --exit-zero"
lint-ruff = "ruff check qpmpc"
lint-ruff-format = "ruff format --check qpmpc"
lint = { depends-on = ["lint-mypy", "lint-pylint", "lint-ruff", "lint-ruff-format"] }

# Per-version features to exercise the supported Python range in CI. These
# cannot share the "default" solve-group as each pins a different interpreter.
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
coverage = { features = ["coverage"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
